name: KOffice Android Build

on:
  push:
    paths:
      - 'koffice/patches/**'
      - 'koffice/scripts/**'
      - 'koffice/upstream'
      - '.github/workflows/koffice-build.yml'
  workflow_dispatch:

concurrency:
  group: koffice-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*/toolchains
          df -h /

      - name: Install engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            nasm yasm \
            bison flex gperf \
            unzip zip \
            uuid-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            python3-lxml \
            python3-polib \
            libgl1-mesa-dev libglu1-mesa-dev \
            ccache

      - name: Preflight host dependencies
        run: |
          set -euo pipefail
          python3 -c 'import lxml, polib; print("Python app dependencies OK")'
          command -v ccache
          command -v autoconf
          echo "Host dependency preflight OK"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Restore engine compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-koffice-arm64-ccache-v1
          restore-keys: |
            ${{ runner.os }}-koffice-arm64-ccache-v1-

      - name: Configure engine compiler cache
        run: |
          ccache -M 5G
          ccache -z

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          NDK_VER=27.2.12479018
          NDK_ZIP=android-ndk-r27c-linux.zip
          NDK_URL=https://dl.google.com/android/repository/${NDK_ZIP}
          NDK_DIR=$SDK/ndk/$NDK_VER
          NDK_CLANG=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

          echo "=== Step 1: Check existing NDK ==="
          if [ -x "$NDK_CLANG" ]; then
            echo "NDK already installed and clang executable: $NDK_CLANG"
            "$NDK_CLANG" --version | head -1
          else
            echo "NDK not found or clang missing at $NDK_CLANG"
            echo "=== Step 2: Download NDK r27c ==="
            curl --retry 3 --retry-delay 10 -sL -o /tmp/${NDK_ZIP} "${NDK_URL}"
            ls -lh /tmp/${NDK_ZIP}
            echo "Download OK ($(stat -c%s /tmp/${NDK_ZIP}) bytes)"

            echo "=== Step 3: Extract NDK ==="
            rm -rf /tmp/ndk-extract
            mkdir -p /tmp/ndk-extract
            unzip -qo /tmp/${NDK_ZIP} -d /tmp/ndk-extract/
            echo "Extract OK"
            # Find the actual top-level directory (name varies by NDK version)
            NDK_SRC_DIR=$(ls -d /tmp/ndk-extract/android-ndk-* 2>/dev/null | head -1)
            if [ -z "$NDK_SRC_DIR" ]; then
              echo "ERROR: cannot find extracted NDK directory"
              ls -la /tmp/ndk-extract/
              exit 1
            fi
            echo "Extracted NDK source dir: $NDK_SRC_DIR"

            echo "=== Step 4: Install NDK to $NDK_DIR ==="
            sudo rm -rf "$NDK_DIR"
            sudo mkdir -p "$NDK_DIR"
            sudo cp -a "$NDK_SRC_DIR"/* "$NDK_DIR"/
            sudo chmod -R a+rX "$NDK_DIR"
            echo "Install OK"

            # Cleanup
            rm -rf /tmp/${NDK_ZIP} /tmp/ndk-extract
          fi

          echo "=== Step 5: Verify NDK clang ==="
          if [ ! -x "$NDK_CLANG" ]; then
            echo "ERROR: clang not found or not executable at $NDK_CLANG"
            echo "Directory listing of NDK:"
            ls -la "$NDK_DIR/" 2>/dev/null || echo "(NDK_DIR does not exist)"
            find "$SDK/ndk" -name clang 2>/dev/null | head -20 || echo "(no clang found)"
            exit 1
          fi
          "$NDK_CLANG" --version | head -1
          echo "NDK clang OK: $NDK_CLANG"

          echo "=== Step 6: Install Android SDK components ==="
          # Find sdkmanager (path varies across runner images)
          SDKMANAGER=""
          for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/13.0/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found; searched common paths"
            find "$SDK" -name sdkmanager 2>/dev/null | head -5
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' --sdk_root="$SDK" || true
          echo "SDK setup done"

          echo "=== Step 7: Export environment ==="
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK setup complete"

      - name: Apply KOffice patches
        working-directory: koffice/upstream
        run: |
          for patch in ../patches/*.patch; do
            git apply --check "$patch" && git apply "$patch"
            echo "Applied: $(basename "$patch")"
          done

      - name: Preflight source tree
        run: |
          set -euo pipefail
          test -x koffice/upstream/autogen.sh
          test -x koffice/upstream/engine/autogen.sh
          echo "Source tree preflight OK"

      - name: Build LibreOffice engine (arm64-v8a)
        working-directory: koffice/upstream/engine
        run: |
          set -o pipefail
          NDK=$ANDROID_NDK_HOME
          echo "NDK path: $NDK"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          cat > autogen.input << EOF
          --build=x86_64-unknown-linux-gnu
          --with-android-ndk=$NDK
          --with-android-sdk=$ANDROID_SDK_ROOT
          --enable-sal-log
          --with-distro=CPAndroidAarch64
          --enable-dbgutil
          EOF
          ./autogen.sh 2>&1 | tee autogen.log
          make -j$(nproc) 2>&1 | tee build-engine.log
          ccache -s

      - name: Build Collabora Office app layer
        working-directory: koffice/upstream
        run: |
          set -o pipefail
          ./autogen.sh
          ./configure \
            --enable-androidapp \
            --with-lo-builddir="$(pwd)/engine" \
            --enable-debug \
            --with-android-abi=arm64-v8a \
            --with-app-name=KOffice \
            --with-app-package-name=org.kemi.koffice \
            --with-vendor=KEMI
          make -j$(nproc) 2>&1 | tee build-app-layer.log

      - name: Build Android APK
        working-directory: koffice/upstream/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build-apk.log

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          find koffice/upstream/android -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koffice-debug-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            koffice/upstream/engine/autogen.log
            koffice/upstream/engine/config.log
            koffice/upstream/engine/build-engine.log
            koffice/upstream/config.log
            koffice/upstream/build-app-layer.log
            koffice/upstream/android/build-apk.log
          retention-days: 7
