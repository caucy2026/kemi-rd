name: KOffice Android Build

on:
  push:
    paths:
      - 'koffice/**'
      - '.github/workflows/koffice-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*/toolchains
          df -h /

      - name: Install engine build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            nasm yasm \
            bison flex gperf \
            unzip zip \
            libgl1-mesa-dev libglu1-mesa-dev \
            ccache
          ccache -M 2G

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android NDK
        run: |
          SDK=/usr/local/lib/android/sdk
          NDK_VER=27.2.12479018
          NDK_ZIP=android-ndk-r27c-linux.zip
          NDK_URL=https://dl.google.com/android/repository/${NDK_ZIP}
          NDK_DIR=$SDK/ndk/$NDK_VER
          if [ ! -f "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "Downloading NDK r27c..."
            curl -sL -o /tmp/$NDK_ZIP "$NDK_URL"
            sudo mkdir -p "$NDK_DIR"
            sudo unzip -qo /tmp/$NDK_ZIP -d /tmp/ndk-extract/
            sudo mv /tmp/ndk-extract/android-ndk-r27c/* "$NDK_DIR/"
            rm -rf /tmp/$NDK_ZIP /tmp/ndk-extract
          fi
          ls -la "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || { echo "NDK clang MISSING"; find "$NDK_DIR" -name clang 2>/dev/null | head -5; exit 1; }
          echo "NDK OK: $NDK_DIR"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --install \
            'platforms;android-36' 'build-tools;36.0.0' \
            --sdk_root="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Apply KOffice patches
        working-directory: koffice/upstream
        run: |
          for patch in ../patches/*.patch; do
            git apply --check "$patch" && git apply "$patch"
            echo "Applied: $(basename "$patch")"
          done

      - name: Build LibreOffice engine (arm64-v8a)
        working-directory: koffice/upstream/engine
        run: |
          set -o pipefail
          NDK=$ANDROID_NDK_HOME
          echo "NDK path: $NDK"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          cat > autogen.input << EOF
          --build=x86_64-unknown-linux-gnu
          --with-android-ndk=$NDK
          --with-android-sdk=$ANDROID_SDK_ROOT
          --enable-sal-log
          --with-distro=CPAndroidAarch64
          --enable-dbgutil
          EOF
          ./autogen.sh 2>&1 | tee autogen.log
          make -j$(nproc) 2>&1 | tee build-engine.log

      - name: Build Collabora Office app layer
        working-directory: koffice/upstream
        run: |
          set -o pipefail
          ./autogen.sh
          ./configure \
            --enable-androidapp \
            --with-lo-builddir="$(pwd)/engine" \
            --enable-debug \
            --with-android-abi=arm64-v8a \
            --with-app-name=KOffice \
            --with-app-package-name=org.kemi.koffice \
            --with-vendor=KEMI
          make -j$(nproc) 2>&1 | tee build-app-layer.log

      - name: Build Android APK
        working-directory: koffice/upstream/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build-apk.log

      - name: Collect APK artifacts
        run: |
          mkdir -p artifacts
          find koffice/upstream/android -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koffice-debug-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            koffice/upstream/engine/autogen.log
            koffice/upstream/engine/config.log
            koffice/upstream/engine/build-engine.log
            koffice/upstream/config.log
            koffice/upstream/build-app-layer.log
            koffice/upstream/android/build-apk.log
          retention-days: 7
